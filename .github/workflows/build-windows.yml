name: Build Windows tray app

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra build

      - name: Build exe
        run: uv run python scripts/build_windows.py

      - uses: actions/upload-artifact@v4
        with:
          name: b2-stats-tray-windows
          path: dist/b2-stats-tray.exe
